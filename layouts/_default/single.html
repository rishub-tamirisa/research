{{ define "main" }}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{ if not .Params.hidemeta }}<div class="post-meta">{{ .Params.author | default site.Params.author }}</div>{{ end }}
  </header>
  <div class="post-content">{{ .Content }}</div>
</article>
{{ end }}
