{{ define "main" }}
<header class="page-header"><h1>{{ .Title }}</h1></header>
{{ with .Content }}<div class="post-content">{{ . }}</div>{{ end }}
{{ range .Pages }}
<article class="post-entry">
  <header class="entry-header"><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2></header>
  <div class="entry-content">{{ .Summary }}</div>
  <div class="entry-footer">{{ .Params.author }}</div>
</article>
{{ end }}
{{ end }}
